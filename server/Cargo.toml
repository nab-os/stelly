[package]
name = "two-khz-server"
version = "0.6.1"
edition = "2021"

# Deliberately not a workspace member with `app`: a shared target directory
# would force a from-scratch rebuild of ort, rusqlite-bundled and dioxus.

[[bin]]
name = "two-khz-server"
path = "src/main.rs"

[dependencies]
# Package is `two-khz-app`; its library target is named `two_khz`. Only the
# shared half, wire types, catalogue shapes, so no dioxus, wry or GTK.
two-khz-app = { path = "../app", default-features = false }

anyhow = "1"
axum = "0.8"
bytemuck = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.11.0"
rand = "0.9"
# `stream` for fetching model weights without holding 500MB in memory.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-stream = "0.1"

# CLAP's two towers, for text steering and the whole of `analyse`.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

# The rest of the pipeline: MP3 decoding for excerpts, the STFT behind CLAP's
# mel front end and the descriptors, EBU R128 loudness, the PCA's eigensolver,
# and the regexes that pull credentials out of the web player.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
realfft = "3.5.0"
ebur128 = "0.1.10"
nalgebra = "0.35.0"
regex = "1.13.1"

[profile.release]
opt-level = 3

# Optimised even under plain `cargo run`. The analyser's resampling, mel
# spectrogram and descriptors are tight loops that run ~7x slower unoptimised,
# 8.8s an excerpt against 1.3s, which turns `analyse` into a crawl.
[profile.dev]
opt-level = 3
