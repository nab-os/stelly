[package]
name = "stelly-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stelly-server"
path = "src/main.rs"

[dependencies]
stelly-audio.workspace = true
stelly-core = { workspace = true, features = ["engine"] }

anyhow.workspace = true
# Mixing: a whole track's beats, bars, phrases and phrase embeddings, and the
# ways from one track into another.
stelly-mix = { git = "https://github.com/nab-os/stelly-mix", tag = "v0.6.0" }
# The music provider, through the protocol every provider answers.
stelly-provider = { workspace = true, features = ["async"] }
argh = "0.1.19"
axum = "0.8"
bytemuck.workspace = true
futures-util.workspace = true
# In-memory cache of the provider's browse responses, so repeat visits skip its budget.
moka = { version = "0.12", features = ["future"] }
rand = "0.9"
# `stream` for fetching model weights without holding 500MB in memory.
reqwest.workspace = true
# For its `prefer-post-quantum` feature; see the root Cargo.toml.
rustls.workspace = true
# Typed queries against `stelly_core::schema`, shared with the app.
# `returning_clauses_for_sqlite_3_35` is for the device id on pairing; the
# bundled SQLite is far newer than 3.35.
diesel = { workspace = true, features = ["returning_clauses_for_sqlite_3_35"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["compression-zstd"] }
# The space's cached bodies, compressed once per change rather than per request.
zstd = "0.14"

# CLAP's two towers, for text steering and the whole of `analyse`. Exact, and
# the same as stelly-audio's, where the pin lives: only one ort can link into
# a build, and a pre-release requirement would take any later pre-release.
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

# The rest of the pipeline, past what stelly-audio does: the PCA's
# eigensolver.
nalgebra = "0.35.0"
whatlang = "0.18.0"

# A stage's worker threads step back behind requests: nice is per thread on
# Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
