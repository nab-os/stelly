name: build

# Ubuntu 24.04 and 26.04 are built on their own runners rather than in
# containers, because the whole point of shipping two .debs is that each links
# against its own release's webkit and glibc. `ubuntu-latest` is deliberately
# not used: it migrates from 24.04 to 26.04 between 2026-10-19 and 2026-11-19,
# which would silently turn the 24.04 leg into a second 26.04 leg.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  DX_VERSION: "0.7.10"
  MAINTAINER: "nab-os <9805355+nab-os@users.noreply.github.com>"

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    name: ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]

    steps:
      - uses: actions/checkout@v7

      # libwebkit2gtk-4.1 is what wry 0.53 links against, and it exists on
      # both releases. libxdo/libappindicator come in via tao and tray-icon.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            server
          key: ubuntu-${{ matrix.ubuntu }}

      # Prebuilt dx: `cargo install dioxus-cli` is a ~10 minute build.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DX_VERSION }}

      # A tag is the version. Everything else gets the crate version plus a
      # build id, because Cargo.toml is not bumped per commit and every
      # artifact would otherwise be called 0.1.0 forever.
      #
      # `+build<n>.g<sha>` is a valid Debian upstream version and sorts *after*
      # the plain crate version, which is what an untagged build off main is.
      - name: Work out the version and artifact suffix
        id: v
        run: |
          CRATE=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${CRATE}+build${{ github.run_number }}.g$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION"                   >> "$GITHUB_OUTPUT"
          echo "suffix=ubuntu-${{ matrix.ubuntu }}" >> "$GITHUB_OUTPUT"
          echo "packaging $VERSION for ubuntu ${{ matrix.ubuntu }}"

      # the GUI half: .deb + AppImage, straight from the bundler
      #
      # --cargo-args needs the `=` form: a value starting with `-` is read as
      # the next flag otherwise.
      - name: Bundle the desktop app
        working-directory: app
        run: |
          dx bundle --release --platform linux \
            --package-types deb --package-types appimage \
            --cargo-args="--locked" \
            --out-dir "$GITHUB_WORKSPACE/staging"

      # the server: API, crawl and the whole pipeline, no GTK, no webkit
      #
      # It takes the app crate with default features off, which is what keeps
      # dioxus, wry and GTK out of this build entirely.
      - name: Build the server
        run: cargo build --release --locked --manifest-path server/Cargo.toml

      - name: Test the server
        run: cargo test --release --locked --manifest-path server/Cargo.toml

      # dx leaves Depends and Maintainer blank; finish-deb.sh fills them in,
      # computing Depends with dpkg-shlibdeps against this runner's release.
      - name: Finish the desktop .deb
        run: |
          mkdir -p dist
          chmod +x .github/scripts/finish-deb.sh
          dpkg-deb -R staging/*_amd64.deb debroot
          .github/scripts/finish-deb.sh debroot \
            "dist/two-khz_${{ steps.v.outputs.version }}_amd64.${{ steps.v.outputs.suffix }}.deb" \
            "$MAINTAINER" "${{ steps.v.outputs.version }}"
          rm -f staging/*_amd64.deb

      - name: Build the server .deb
        run: |
          R=serverroot
          mkdir -p "$R/DEBIAN" "$R/usr/bin" "$R/usr/share/two-khz" \
                   "$R/usr/share/doc/two-khz-server"
          install -m755 server/target/release/two-khz-server "$R/usr/bin/two-khz-server"
          install -m644 schema.sql "$R/usr/share/two-khz/schema.sql"
          install -m644 README.md  "$R/usr/share/doc/two-khz-server/README.md"
          sed -e "s/@VERSION@/${{ steps.v.outputs.version }}/" \
            > "$R/DEBIAN/control" <<'EOF'
          Package: two-khz-server
          Version: @VERSION@
          Architecture: amd64
          Section: sound
          Priority: optional
          Homepage: https://github.com/nab-os/2kHz
          Description: 2kHz server: API, crawler and analysis pipeline
           Owns the Qobuz credentials, the SQLite corpus, the CLAP models and every
           pipeline stage, and serves them to 2kHz clients over HTTP. No GUI: this
           package deliberately links neither GTK nor webkit.
          EOF
          .github/scripts/finish-deb.sh "$R" \
            "dist/two-khz-server_${{ steps.v.outputs.version }}_amd64.${{ steps.v.outputs.suffix }}.deb" \
            "$MAINTAINER" "${{ steps.v.outputs.version }}"

      - name: Build the tarballs
        run: |
          V=${{ steps.v.outputs.version }}
          S=${{ steps.v.outputs.suffix }}
          T=$(mktemp -d)

          mkdir -p "$T/two-khz-$V"
          cp app/target/dx/two-khz-app/release/linux/app/two-khz-app "$T/two-khz-$V/"
          cp README.md "$T/two-khz-$V/"
          cp -r app/assets/icons "$T/two-khz-$V/icons"
          tar -C "$T" -czf "dist/two-khz_${V}_${S}.tar.gz" "two-khz-$V"

          mkdir -p "$T/two-khz-server-$V"
          cp server/target/release/two-khz-server "$T/two-khz-server-$V/"
          cp schema.sql README.md "$T/two-khz-server-$V/"
          tar -C "$T" -czf "dist/two-khz-server_${V}_${S}.tar.gz" "two-khz-server-$V"

      - name: Collect the AppImage
        run: |
          mv staging/*.AppImage \
            "dist/two-khz_${{ steps.v.outputs.version }}_${{ steps.v.outputs.suffix }}.AppImage"

      - name: Verify the packages
        run: |
          for f in dist/*.deb; do
            echo "=== $f"
            dpkg-deb -I "$f" | grep -E '^ (Package|Version|Depends|Maintainer):'
          done
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.ubuntu }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- android
  #
  # Signs when the keystore secrets are readable, and builds an unsigned APK
  # when they are not, rather than being skipped outright. That is what keeps
  # arm64 covered on pull requests from forks, which structurally cannot read
  # a secret, there is deliberately no `if:` on this job.
  #
  # A tag is the exception and fails instead: a release must never carry an
  # APK nobody can install.
  #
  # The keystore behind ANDROID_KEYSTORE_BASE64 is generated once with
  # `keytool -genkeypair -keyalg RSA -keysize 4096`, and is the app's identity
  # to Android: replacing it means every existing install has to be
  # uninstalled rather than upgraded.
  android:
    name: android (arm64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The `secrets` context cannot be read from a step's `if:`, so whether
      # the keystore is available becomes an output here and the two collect
      # steps below branch on that instead.
      #
      # Half a keystore is a misconfiguration rather than a fork, and says so:
      # silently shipping unsigned because one secret was renamed is the
      # failure worth being loud about.
      - name: Look for the signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          present=0
          missing=
          if [ -n "${KEYSTORE:-}" ];   then present=$((present + 1)); else missing="$missing ANDROID_KEYSTORE_BASE64";   fi
          if [ -n "${STORE_PASS:-}" ]; then present=$((present + 1)); else missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -n "${ALIAS:-}" ];      then present=$((present + 1)); else missing="$missing ANDROID_KEY_ALIAS";         fi

          if [ "$present" -eq 3 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore available: this APK will be signed"
          elif [ "$present" -gt 0 ]; then
            echo "::error::Signing is half-configured; these secrets are unset:$missing"
            exit 1
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::A release cannot ship an unsigned APK, and these secrets are unset:$missing"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing keystore readable; building an unsigned APK."
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: android

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DX_VERSION }}

      - name: Work out the version
        id: v
        run: echo "version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # android-env.sh honours a pre-set ANDROID_NDK_HOME, so point it at the
      # NDK the runner image already ships rather than downloading another one.
      # API 26 is the floor for the WebView features wry uses.
      - name: Configure the NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"         >> "$GITHUB_ENV"
          echo "using NDK: $ANDROID_NDK_LATEST_HOME"

      # arm64 only, and not by choice: manganis, the asset crate dioxus pulls
      # in, is compile_error! on 32-bit Android. --target is load-bearing,
      # without it dx builds x86_64 for an emulator, which will not install
      # on a phone.
      - name: Build the APK
        working-directory: app
        run: |
          . ./android-env.sh
          dx bundle --release --platform android \
            --target aarch64-linux-android \
            --no-default-features --features mobile \
            --package-types apk \
            --cargo-args="--locked" \
            --out-dir "$GITHUB_WORKSPACE/staging"

      - name: Sign the APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OUT: dist/two-khz_${{ steps.v.outputs.version }}_arm64.apk
        run: |
          set -euo pipefail
          mkdir -p dist

          # -print -quit rather than `| head -1`: under pipefail, head closing
          # the pipe can hand find a SIGPIPE and fail the step at random.
          APK=$(find staging -name '*.apk' -print -quit)
          [ -n "$APK" ] || { echo "::error::dx produced no .apk"; find staging -type f; exit 1; }
          echo "signing $APK"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS=$(mktemp -d)/ks.jks
          printf '%s' "$KEYSTORE" | base64 -d > "$KS"

          # zipalign must run before apksigner: v2+ signatures cover the whole
          # archive, so realigning afterwards would invalidate them.
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass "pass:${KEY_PASS:-$STORE_PASS}" \
            --out "$OUT" \
            aligned.apk
          rm -f "$KS" aligned.apk

          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          ls -lh dist

      # No keystore, a fork's pull request. Aligned all the same, since
      # alignment is the half that needs no key, and `-unsigned` is in the
      # filename because this is a build artifact rather than something
      # `adb install` will accept.
      - name: Collect the unsigned APK
        if: steps.signing.outputs.signed != 'true'
        env:
          OUT: dist/two-khz_${{ steps.v.outputs.version }}_arm64-unsigned.apk
        run: |
          set -euo pipefail
          mkdir -p dist

          APK=$(find staging -name '*.apk' -print -quit)
          [ -n "$APK" ] || { echo "::error::dx produced no .apk"; find staging -type f; exit 1; }
          echo "collecting $APK"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$APK" "$OUT"
          "$BT/zipalign" -c -v 4 "$OUT" > /dev/null
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------- docker
  #
  # Built on every push, published only from a tag: a broken Dockerfile should
  # surface next to the .debs, but `latest` moving on each commit to main is a
  # surprise for anyone who pinned it.
  #
  # Two registries for the slim image. Docker Hub is the address people expect;
  # GHCR costs nothing, has no pull limit, and authenticates with GITHUB_TOKEN
  # rather than a secret that has to be rotated by hand.
  docker:
    name: docker (server)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Off, or build-push-action drops a .dockerbuild artifact into the run and
    # the release job has one more thing to filter out. The summary it feeds
    # is not worth an artifact nobody downloads.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # Both gated on the tag: a pull request from a fork cannot read
      # DOCKERHUB_TOKEN, and nothing below it pushes anyway.
      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` is not usable as the GHCR name: the registry
      # refuses uppercase, and this repo is `2kHz`.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            docker.io/4gjr3z1t/2khz
            ghcr.io/${{ github.repository_owner }}/two-khz-server
          # `type=ref` first and unconditionally: it is what publishes the
          # `v`-prefixed name the README and compose.yaml pin to. The semver
          # patterns below add the unprefixed `0.6.1` and `0.6`, and only
          # started firing at v0.6.1, type=semver declines a tag with no
          # patch component, which every release up to v0.6 was.
          #
          # branch and pr matter even though neither is ever pushed: with no
          # tag at all the build produces an unnamed image, and the smoke test
          # below has nothing to run.
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: server
          platforms: linux/amd64
          # A second arch here would only build under emulation, which for
          # ort and the bundled SQLite is most of an hour.
          push: ${{ github.ref_type == 'tag' }}
          load: ${{ github.ref_type != 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap proof the binary in the image actually runs: it opens the
      # database, finds no devices and says so.
      #
      # The reference comes from the metadata step rather than being written
      # out here. A literal `4gjr3z1t/2khz:latest` reads as the same thing and
      # is not: docker would pull the published tag and test that instead of
      # the image just built, passing even on a Dockerfile that cannot build.
      - name: Smoke test
        if: github.ref_type != 'tag'
        run: |
          IMAGE=$(head -1 <<< "$DOCKER_METADATA_OUTPUT_TAGS")
          if [ -z "$IMAGE" ]; then
            echo "no tag was generated; the built image has no name" >&2
            exit 1
          fi
          echo "testing $IMAGE"
          docker run --rm "$IMAGE" devices

  # -------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Two named downloads rather than one unfiltered one: the docker jobs'
      # build-push-action uploads a .dockerbuild build record into the same
      # run, and an unfiltered download both fails on it and would attach it
      # as a release asset.
      #
      # The APK here is always signed, the android job fails a tag build
      # outright when the keystore is missing.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ubuntu-*
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/android
          name: android
      - run: ls -lhR artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
