[package]
name = "stelly-audio"
version.workspace = true
edition.workspace = true

# Audio analysis with no network and no database: decoding, resampling, the
# descriptors and CLAP's audio tower. Shared with stelly-mix, which runs it on
# local files.

[features]
default = ["clap"]
# CLAP's audio tower through ONNX Runtime. The mel front end alone needs none.
clap = ["dep:ort"]
# Every codec and container symphonia has, for local files. MP3 alone is what
# Qobuz excerpts need.
all-codecs = ["symphonia/all-codecs", "symphonia/all-formats"]

[dependencies]
anyhow.workspace = true
ebur128 = "0.1.10"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }
realfft = "3.5.0"
serde.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }

[dev-dependencies]
bytemuck.workspace = true
