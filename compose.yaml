# An example deployment of the server and two music providers beside it:
# the Qobuz gateway and YouTube Music. Copy it, adjust it, then:
#
#   echo "STELLY_PROVIDER_TOKEN=$(openssl rand -hex 32)" > .env  # shared by all
#   echo "YTMUSIC_PUBLIC_URL=http://<this-host>:7712" >> .env    # see ytmusic
#   cp ~/.config/stelly-qobuz/.env qobuz.env                     # Qobuz credentials
#   docker compose pull
#   docker compose run --rm server pair --name desktop --scope admin
#   docker compose up -d
#   docker compose cp ~/.config/stelly-ytmusic/browser.json ytmusic:/data/  # then restart it
#
# Pairing prints a token once. Point a client at it with:
#
#   STELLY_SERVER=http://<this-host>:7700 STELLY_TOKEN=<token>

name: stelly

services:
  server:
    # Pinned rather than `latest`, so that `compose pull` on a bad day cannot
    # swap the running server for a release nobody here has tried.
    image: stellymusic/stelly:v2.4.1

    # The whole pipeline is in this one image. The CLAP weights (~620MB) are
    # fetched into the data volume on first use, or up front with:
    #
    #   docker compose run --rm server models
    #
    # Building locally instead of pulling: the only way to run uncommitted
    # changes, is this in place of `image:` above:
    #
    #   build:
    #     context: .

    # Loopback inside the container would be unreachable from outside it, so
    # the bind is 0.0.0.0 and the *published* port is the one restricted to
    # localhost. This speaks plain HTTP and hands out device tokens and signed
    # stream URLs, so reaching it from another machine belongs behind
    # WireGuard/Tailscale or a TLS proxy, not a wider port mapping.
    command: ["serve", "--bind", "0.0.0.0:7700"]
    ports:
      - "127.0.0.1:7700:7700"

    # The music, through the providers below, most preferred first; each
    # wants the shared STELLY_PROVIDER_TOKEN, from .env. Keep the Qobuz
    # gateway among them: a catalogue from before 2.0 is its.
    environment:
      STELLY_PROVIDERS: http://qobuz:7710,http://ytmusic:7712
    env_file:
      - path: .env
        required: false
    depends_on:
      - qobuz
      - ytmusic

    volumes:
      - data:/data     # corpus, space, device tokens, models, back this up
      - cache:/cache   # audio excerpts, evicted as analyse runs
      # Weights already on the host? Mount them instead of re-downloading:
      # - /srv/stelly/models:/data/models

    # PID 1 has no default signal dispositions, so without an init a `docker
    # stop` would wait out the grace period before the server went down.
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  # The Qobuz account, its credentials and its one request queue, for the
  # server and anything else that talks to Qobuz. Pinned like the server, and
  # bumped with it; on the compose network only, not published: its stream
  # URLs are Qobuz's own. Publish 127.0.0.1:7710:7710 too for stelly-mix on
  # the host.
  qobuz:
    image: stellymusic/stelly-qobuz:v0.3.0
    command: ["serve", "--bind", "0.0.0.0:7710"]
    # The account, QOBUZ_APP_ID, QOBUZ_APP_SECRETS, QOBUZ_USER_AUTH_TOKEN, as
    # `stelly-qobuz login` wrote them on a machine with a browser: its
    # sign-in's redirect cannot reach a container, so it is not run here.
    environment:
      # The shared token, which it listens with under its own name.
      STELLY_QOBUZ_TOKEN: ${STELLY_PROVIDER_TOKEN}
    env_file:
      - path: qobuz.env
        required: true
    volumes:
      - qobuz:/data    # the credentials `login` writes, back this up too
    init: true
    restart: unless-stopped

  # The YouTube Music account. Its audio is relayed through it, YouTube's
  # stream URLs answering only the address that asked, so devices fetch from
  # it directly: its port is published like the server's, to be reached the
  # same way, and YTMUSIC_PUBLIC_URL is that address as devices see it. Its
  # sign-in is browser.json in its volume, from `stelly-ytmusic login` on a
  # machine with a browser, copied in as above.
  ytmusic:
    image: stellymusic/stelly-ytmusic:v0.3.0
    environment:
      PUBLIC_URL: ${YTMUSIC_PUBLIC_URL:?set YTMUSIC_PUBLIC_URL in .env, how devices reach port 7712}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:7712:7712"
    volumes:
      - ytmusic:/data  # browser.json, cookies.txt and ids.db: back this up too
    init: true
    restart: unless-stopped

  # A music folder too, if there is one: add `http://local:7710` to
  # STELLY_PROVIDERS above, where in the order it should come.
  #
  #   local:
  #     build: https://github.com/nab-os/stelly-local.git#v0.1.0
  #     environment:
  #       PUBLIC_URL: http://<this-host>:7711   # how devices reach the files
  #     env_file: .env                          # STELLY_PROVIDER_TOKEN
  #     volumes:
  #       - /srv/music:/music:ro
  #     ports:
  #       - "127.0.0.1:7711:7710"

volumes:
  data:
  cache:
  qobuz:
  ytmusic:
