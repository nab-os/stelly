[package]
name = "stelly-app"
version.workspace = true
edition.workspace = true

[lib]
name = "stelly"
path = "src/lib.rs"
# `lib` for the binary below; `cdylib` so the APK can load it and call
# `start_app` through JNI.
crate-type = ["lib", "cdylib"]

# Also the Android entry point: dioxus' `start_app` trampoline dlsym's `main`,
# so the APK's shared library is this target built with `--features mobile`.
[[bin]]
name = "stelly-app"
path = "src/main.rs"
required-features = ["gui"]

# ---------------------------------------------------------------- features
#
# Every build is a client of `stelly-server`: Qobuz, the pipeline and the
# models live there. Without `gui` this is just the client library.
#
#   desktop: a dioxus window.
#   mobile:  the same, as an Android app.
[features]
default = ["desktop"]
# Anything with a screen: brings in `app` and `ui`, which desktop and mobile
# share in full.
gui = ["dep:dioxus"]
desktop = ["gui", "dioxus/desktop"]
mobile = ["gui", "dioxus/mobile"]
# Exploratory; see the wasm notes in README.
web = ["gui", "dioxus/web"]

[dependencies]
stelly-core.workspace = true

anyhow.workspace = true
futures-util.workspace = true
# `stream` is what lets the remote backend hold the pipeline log open as SSE
# rather than polling it.
reqwest.workspace = true
# For its `prefer-post-quantum` feature; see the root Cargo.toml.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[dependencies.dioxus]
version = "0.7"
optional = true
# Defaults carry rsx!, signals, hooks and html, and no platform, that comes
# from the desktop/mobile features above.

# The JNI entry point and logging; see src/mobile.rs. `jni` and `ndk-context`
# are the versions tao already uses, for the playback notification in
# src/ui/now_playing.rs.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
log = "0.4"
ndk-context = "0.1"

# ------------------------------------------------------- mobile scaffolding
#
# Left over from `cargo mobile init` and unused; see Dioxus.toml.
# WRY_ANDROID_LIBRARY must equal [lib] name, the .so the activity loads.

[package.metadata.cargo-android]
app-activity-name = "fr.glargh.stelly.MainActivity"
app-dependencies = [
    "androidx.webkit:webkit:1.6.1",
    "androidx.appcompat:appcompat:1.7.1",
    "com.google.android.material:material:1.12.0",
    "androidx.activity:activity-ktx:1.10.1",
    "androidx.lifecycle:lifecycle-process:2.10.0",
]
project-dependencies = []
app-plugins = []
app-permissions = [ "android.permission.INTERNET" ]
app-theme-parent = "Theme.MaterialComponents.DayNight.DarkActionBar"
vulkan-validation = false

[package.metadata.cargo-android.env-vars]
WRY_ANDROID_PACKAGE = "fr.glargh.stelly"
WRY_ANDROID_LIBRARY = "stelly"
WRY_ANDROID_KOTLIN_FILES_OUT_DIR = "<android-project-dir>/app/src/main/kotlin/fr/glargh/stelly"
