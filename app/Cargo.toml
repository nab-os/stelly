[package]
name = "two-khz-app"
version = "0.7.1"
edition = "2021"

[lib]
name = "two_khz"
path = "src/lib.rs"
# `lib` for the server, which shares the wire types; `cdylib` so the APK can
# load it and call `start_app` through JNI.
crate-type = ["lib", "cdylib"]

# Also the Android entry point: dioxus' `start_app` trampoline dlsym's `main`,
# so the APK's shared library is this target built with `--features mobile`.
[[bin]]
name = "two-khz-app"
path = "src/main.rs"
required-features = ["gui"]

# ---------------------------------------------------------------- features
#
# Every build is a client of `two-khz-server`: Qobuz, the pipeline and the
# models live there. Without `gui` this is just the shared library.
#
#   desktop: a dioxus window.
#   mobile:  the same, as an Android app.
[features]
default = ["desktop"]
# Anything with a screen: brings in `app` and `ui`, which desktop and mobile
# share in full.
gui = ["dep:dioxus"]
desktop = ["gui", "dioxus/desktop"]
mobile = ["gui", "dioxus/mobile"]
# Exploratory; see the wasm notes in README.
web = ["gui", "dioxus/web"]

[dependencies]
anyhow = "1"
bytemuck = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.11.0"
memmap2 = "0.9"
# `stream` is what lets the remote backend hold the pipeline log open as SSE
# rather than polling it.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "stream"] }
# The catalogue, through the tables in `src/schema.rs`, which the server
# shares. SQLite itself comes from `libsqlite3-sys` below, or on wasm from
# Diesel's own `sqlite-wasm-rs`.
diesel = { version = "2.3.13", features = ["sqlite"] }
# Never named in the source: reqwest takes rustls with default features off,
# which drops `prefer-post-quantum` and leaves X25519MLKEM768 advertised in
# `supported_groups` with no matching key share. A server that prefers that
# group then has to answer with a HelloRetryRequest, and an ingress that
# mishandles one closes the connection mid-handshake. Naming rustls here turns
# the feature back on through unification, so the first flight already carries
# the post-quantum key share and the handshake needs one round trip.
rustls = { version = "0.23.45", default-features = false, features = ["prefer-post-quantum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }

[dependencies.dioxus]
version = "0.7"
optional = true
# Defaults carry rsx!, signals, hooks and html, and no platform, that comes
# from the desktop/mobile features above.

# Bundled, so there is no system SQLite to match and Android needs nothing but
# the NDK's clang. The server names it too: only one crate may link SQLite, so
# the two have to agree on a version.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

# The JNI entry point and logging; see src/mobile.rs.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[profile.release]
opt-level = 3
lto = true

# ------------------------------------------------------- mobile scaffolding
#
# Left over from `cargo mobile init` and unused; see Dioxus.toml.
# WRY_ANDROID_LIBRARY must equal [lib] name, the .so the activity loads.

[package.metadata.cargo-android]
app-activity-name = "fr.glargh.twokhz.MainActivity"
app-dependencies = [
    "androidx.webkit:webkit:1.6.1",
    "androidx.appcompat:appcompat:1.7.1",
    "com.google.android.material:material:1.12.0",
    "androidx.activity:activity-ktx:1.10.1",
    "androidx.lifecycle:lifecycle-process:2.10.0",
]
project-dependencies = []
app-plugins = []
app-permissions = [ "android.permission.INTERNET" ]
app-theme-parent = "Theme.MaterialComponents.DayNight.DarkActionBar"
vulkan-validation = false

[package.metadata.cargo-android.env-vars]
WRY_ANDROID_PACKAGE = "fr.glargh.twokhz"
WRY_ANDROID_LIBRARY = "two_khz"
WRY_ANDROID_KOTLIN_FILES_OUT_DIR = "<android-project-dir>/app/src/main/kotlin/fr/glargh/twokhz"
