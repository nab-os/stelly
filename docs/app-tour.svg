<circle cx="250" cy="150" r="14" fill="#ff9e64"/><text x="250" y="155" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">1</text>
<text x="228" y="148" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="end">Main area</text>
<text x="228" y="167" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Favourites to start with. Opens</text>
<text x="228" y="183" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">artist, album and track pages,</text>
<text x="228" y="199" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">search, settings.</text>
<line x1="606" y1="444" x2="250" y2="330" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="606" cy="444" r="4" fill="#ff9e64"/>
<circle cx="250" cy="330" r="14" fill="#ff9e64"/><text x="250" y="335" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">2</text>
<text x="228" y="328" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="end">Search</text>
<text x="228" y="347" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Your analysed tracks or all of</text>
<text x="228" y="363" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Qobuz, from the same box.</text>
<line x1="656" y1="456" x2="250" y2="440" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="656" cy="456" r="4" fill="#ff9e64"/>
<circle cx="250" cy="440" r="14" fill="#ff9e64"/><text x="250" y="445" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">3</text>
<text x="228" y="438" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="end">Map</text>
<text x="228" y="457" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Every analysed track as a dot.</text>
<text x="228" y="473" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Click one to see what it is,</text>
<text x="228" y="489" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">click that to open it.</text>
<line x1="352" y1="528" x2="250" y2="560" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="352" cy="528" r="4" fill="#ff9e64"/>
<circle cx="250" cy="560" r="14" fill="#ff9e64"/><text x="250" y="565" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">4</text>
<text x="228" y="558" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="end">Now playing</text>
<text x="228" y="577" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">Cover, title, album and artist,</text>
<text x="228" y="593" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="end">each opens its page.</text>
<line x1="868" y1="172" x2="950" y2="150" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="868" cy="172" r="4" fill="#ff9e64"/>
<circle cx="950" cy="150" r="14" fill="#ff9e64"/><text x="950" y="155" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">5</text>
<text x="972" y="148" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="start">Generate</text>
<text x="972" y="167" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">The main tool. Pick a starting</text>
<text x="972" y="183" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">track, a mode and how many,</text>
<text x="972" y="199" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">then Generate. Play or queue</text>
<text x="972" y="215" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">the result.</text>
<line x1="858" y1="454" x2="950" y2="290" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="858" cy="454" r="4" fill="#ff9e64"/>
<circle cx="950" cy="290" r="14" fill="#ff9e64"/><text x="950" y="295" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">6</text>
<text x="972" y="288" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="start">Tune the space</text>
<text x="972" y="307" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">Decide what “similar” means:</text>
<text x="972" y="323" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">more tempo, less era, and so on.</text>
<line x1="862" y1="510" x2="950" y2="520" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="862" cy="510" r="4" fill="#ff9e64"/>
<circle cx="950" cy="520" r="14" fill="#ff9e64"/><text x="950" y="525" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">8</text>
<text x="972" y="518" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="start">Queue</text>
<text x="972" y="537" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">Drag to reorder, × to remove.</text>
<text x="972" y="553" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">On a phone: long-press to drag,</text>
<text x="972" y="569" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">swipe to remove.</text>
<line x1="808" y1="510" x2="950" y2="400" stroke="#ff9e64" stroke-width="1.5"/>
<circle cx="808" cy="510" r="4" fill="#ff9e64"/>
<circle cx="950" cy="400" r="14" fill="#ff9e64"/><text x="950" y="405" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">7</text>
<text x="972" y="398" font-size="15" fill="#e5e7ef" font-weight="bold" text-anchor="start">Volume</text>
<text x="972" y="417" font-size="12" fill="#8b90a3" font-weight="normal" text-anchor="start">Drag or scroll.</text>
<rect x="40" y="620" width="1120" height="120" rx="12" fill="#1b1d26"/>
<text x="64" y="652" font-size="17" fill="#e5e7ef" font-weight="bold" text-anchor="start">A first session</text>
<circle cx="78" cy="690" r="14" fill="#7aa2f7"/><text x="78" y="695" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">1</text>
<text x="102" y="680" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">Search for a song</text>
<text x="102" y="698" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">you like, or click a</text>
<text x="102" y="716" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">dot on the map</text>
<line x1="276" y1="690" x2="320" y2="690" stroke="#8b90a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="350" cy="690" r="14" fill="#7aa2f7"/><text x="350" y="695" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">2</text>
<text x="374" y="680" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">Open it and check</text>
<text x="374" y="698" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">it says “in space”,</text>
<text x="374" y="716" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">or press fetch</text>
<line x1="548" y1="690" x2="592" y2="690" stroke="#8b90a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="622" cy="690" r="14" fill="#7aa2f7"/><text x="622" y="695" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">3</text>
<text x="646" y="680" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">In Generate, choose</text>
<text x="646" y="698" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">neighbours or radio</text>
<text x="646" y="716" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">and press Generate</text>
<line x1="820" y1="690" x2="864" y2="690" stroke="#8b90a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="894" cy="690" r="14" fill="#7aa2f7"/><text x="894" y="695" font-size="14" fill="#12131a" font-weight="bold" text-anchor="middle">4</text>
<text x="918" y="680" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">Play the list, then</text>
<text x="918" y="698" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">tweak the sliders and</text>
<text x="918" y="716" font-size="13" fill="#8b90a3" font-weight="normal" text-anchor="start">generate again</text>
</svg>
