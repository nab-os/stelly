[package]
name = "stelly-core"
version.workspace = true
edition.workspace = true

# What the app and the server both speak: the wire types and the session
# rules. No UI, no HTTP client.

[features]
# The catalogue, the space and navigation over it. Only the server loads a
# space, so the apps leave this off and link no SQLite at all.
engine = ["dep:bytemuck", "dep:diesel", "dep:libsqlite3-sys", "dep:memmap2"]

[dependencies]
anyhow.workspace = true
bytemuck = { workspace = true, optional = true }
# The catalogue, through the tables in `src/schema.rs`. SQLite itself comes
# from `libsqlite3-sys` below.
diesel = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
libsqlite3-sys = { workspace = true, optional = true }
